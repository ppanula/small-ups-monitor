name: Release

# Push a tag like v1.0.0 to build the exe and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Check tag matches Cargo version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match Cargo.toml version $version" }

      - name: Test
        run: cargo test --all-features

      - name: Build
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/small-ups-monitor.exe dist/
          $hash = (Get-FileHash dist/small-ups-monitor.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  small-ups-monitor.exe" | Set-Content dist/small-ups-monitor.exe.sha256 -Encoding ascii
          # Release notes: this version's section of CHANGELOG.md.
          $version = "${{ github.ref_name }}".TrimStart('v')
          $lines = Get-Content CHANGELOG.md
          $start = [array]::IndexOf($lines, ($lines | Where-Object { $_ -like "## [$version]*" } | Select-Object -First 1))
          if ($start -lt 0) { throw "CHANGELOG.md has no section for $version" }
          $end = $lines.Count
          for ($i = $start + 1; $i -lt $lines.Count; $i++) { if ($lines[$i] -like '## *') { $end = $i; break } }
          $lines[($start + 1)..($end - 1)] | Set-Content dist/notes.md -Encoding utf8

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/small-ups-monitor.exe dist/small-ups-monitor.exe.sha256 `
            --title "Small UPS Monitor ${{ github.ref_name }}" --notes-file dist/notes.md
