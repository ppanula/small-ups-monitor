name: Release

# Push a tag like v1.0.0 to build the exe and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Check tag matches Cargo version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match Cargo.toml version $version" }

      - name: Test
        run: cargo test --all-features

      - name: Build (modern, Windows 10/11)
        run: cargo build --release

      # The Windows 7 build needs nightly + rust-src to rebuild std for the
      # Win7 baseline (x86_64-win7-windows-msvc is a Tier 3 target).
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Build (Windows 7 / Server 2008 R2)
        run: cargo +nightly build -Z build-std --target x86_64-win7-windows-msvc --release

      - name: Check imports exist on Windows 7
        shell: pwsh
        run: ./tools/check-win7-imports.ps1 target/x86_64-win7-windows-msvc/release/small-ups-monitor.exe

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/small-ups-monitor.exe dist/small-ups-monitor.exe
          Copy-Item target/x86_64-win7-windows-msvc/release/small-ups-monitor.exe dist/small-ups-monitor-win7.exe
          foreach ($name in @('small-ups-monitor.exe', 'small-ups-monitor-win7.exe')) {
            $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLower()
            "$hash  $name" | Set-Content "dist/$name.sha256" -Encoding ascii
          }
          # Release notes: this version's section of CHANGELOG.md.
          $version = "${{ github.ref_name }}".TrimStart('v')
          $lines = Get-Content CHANGELOG.md
          # Literal match: with -like, "[1.0.0]" would be a wildcard character set.
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) { if ($lines[$i].StartsWith("## [$version]")) { $start = $i; break } }
          if ($start -lt 0) { throw "CHANGELOG.md has no section for $version" }
          $end = $lines.Count
          for ($i = $start + 1; $i -lt $lines.Count; $i++) { if ($lines[$i].StartsWith('## ')) { $end = $i; break } }
          $lines[($start + 1)..($end - 1)] | Set-Content dist/notes.md -Encoding utf8

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            dist/small-ups-monitor.exe dist/small-ups-monitor.exe.sha256 `
            dist/small-ups-monitor-win7.exe dist/small-ups-monitor-win7.exe.sha256 `
            --title "Small UPS Monitor ${{ github.ref_name }}" --notes-file dist/notes.md
