[workspace]
resolver = "3"
members = ["core", "app"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ppanula/small-ups-monitor"
publish = false

[workspace.dependencies]
windows-sys = "0.61"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
